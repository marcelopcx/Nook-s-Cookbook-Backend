services:
  db:
    image: postgres:16-alpine
    container_name: nooks_cookbook_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nooks
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: nooks_cookbook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Se ejecuta solo la primera vez que se crea el volumen (BD vacía).
      - ./db/nooks_cookbook.sql:/docker-entrypoint-initdb.d/01-nooks_cookbook.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nooks -d nooks_cookbook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
